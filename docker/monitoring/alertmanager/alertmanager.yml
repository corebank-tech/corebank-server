# 알림 채널: Discord. 웹훅 주소는 비밀이라 저장소에 두지 않고 VM 파일 /etc/alertmanager/discord_webhook(컨테이너 안 경로)에서 읽는다.
route:
  receiver: discord
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /etc/alertmanager/discord_webhook
        send_resolved: true
