
services:
  # Corebank Spring Boot 서버 컨테이너
  corebank-server:
    image: ${DOCKER_USERNAME:-local}/${DOCKER_IMAGE_NAME:-corebank-server}:${TAG:-latest}
    container_name: ${CONTAINER_NAME:-corebank-server}
    restart: unless-stopped
    ports:
      - "80:${SERVER_PORT:-8080}"
    env_file:
      - ${COREBANK_ENV_FILE:-.env.corebank}
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - APP_FDS_POLICY_ENABLED=${APP_FDS_POLICY_ENABLED:-true}
      - APP_FDS_SCORE_ENABLED=${APP_FDS_SCORE_ENABLED:-true}
      - APP_FDS_SCORE_BASE_URL=http://corebank-fds-agent:8000
      - APP_FDS_INVESTIGATION_ENABLED=${APP_FDS_INVESTIGATION_ENABLED:-true}
      - APP_FDS_INVESTIGATION_BASE_URL=http://corebank-fds-agent:8000
    depends_on:
      corebank-fds-agent:
        condition: service_healthy
    networks:
      - corebank-net

  # Python FDS Agent는 사설 네트워크에서만 접근하며 호스트 포트를 공개하지 않는다.
  corebank-fds-agent:
    image: ${FDS_AGENT_IMAGE:-corebank-fds-agent}:${FDS_AGENT_TAG:-local}
    build:
      context: ${FDS_AGENT_BUILD_CONTEXT:-../corebank-fds-agent}
      args:
        GIT_SHA: ${FDS_AGENT_GIT_SHA:-local}
    restart: unless-stopped
    env_file:
      - ${FDS_ENV_FILE:-.env.fds-agent}
    environment:
      - FDS_BE_INTERNAL_BASE_URL=http://corebank-server:8080
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - corebank-net

  # 로컬 개발용 MySQL 8.4 DB
  minicore-mysql:
    image: mysql:8.4.10
    container_name: minicore-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=localpw
      - TZ=Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plocalpw"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - corebank-net

networks:
  corebank-net:
    driver: bridge

volumes:
  mysql-data:
