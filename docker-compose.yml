
services:
  # Corebank Spring Boot 서버 컨테이너
  corebank-server:
    image: ${DOCKER_USERNAME:-local}/${DOCKER_IMAGE_NAME:-corebank-server}:${TAG:-latest}
    container_name: ${CONTAINER_NAME:-corebank-server}
    restart: unless-stopped
    ports:
      - "80:${SERVER_PORT:-8080}"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - corebank-net

  # 로컬 개발용 MySQL 8.4 DB
  minicore-mysql:
    image: mysql:8.4.10
    container_name: minicore-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=localpw
      - TZ=UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plocalpw"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - corebank-net

networks:
  corebank-net:
    driver: bridge

volumes:
  mysql-data:
