server:
  servlet:
    session:
      cookie:
        secure: false
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/minicore?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Seoul&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:localpw}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    clean-disabled: true
  data:
    redis:
      host: localhost

logging:
  level:
    org.hibernate.SQL: debug

app:
  demo-data:
    continue-on-error: true
  security:
    cors:
      allowed-origins:
        - http://localhost:5173
