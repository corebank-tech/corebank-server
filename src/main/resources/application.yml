server:
  servlet:
    context-path: /api/v1
    session:
      timeout: 10m
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
spring:
  # 이의제기 첨부(파일 하나 10MB, 합계 30MB)는 서버가 직접 검사해 PST0007 로 거절한다. 그 검사가 먼저 돌도록 여기 한도는 넉넉히 둔다
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 40MB
  session:
    timeout: ${server.servlet.session.timeout}
    jdbc:
      # 세션 DDL은 Flyway만 실행하고 만료 행은 매분 정리한다.
      initialize-schema: never
  application:
    name: corebank
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
          batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
  task:
    scheduling:
      pool:
        # COB(23:30)가 대사로 길어져도 00:10 자동이체 등 다른 @Scheduled가 같은 스레드를 기다리지 않게 한다 (#604)
        size: 2
  modulith:
    events:
      # 리스너가 성공하면 발행 기록을 지운다. 남아 있는 행이 곧 아직 전달되지 않은 이벤트다 (#437)
      completion-mode: delete
      jdbc:
        schema-initialization:
          # EVENT_PUBLICATION 은 Flyway 가 만든다
          enabled: false
      # 처리 도중 서버가 죽어 멈춘 기록을 FAILED 로 바꿔 재제출 대상에 넣는다. 즉시 재시도까지 합쳐도 몇 초라 10분이면 멈춘 것이다 (#709)
      staleness:
        published: 10m
        processing: 10m
        resubmitted: 10m

management:
  metrics:
    distribution:
      percentiles-histogram:
        # 구간별 건수(_bucket)를 내야 Prometheus에서 histogram_quantile로 이체 p95를 낼 수 있다(PH-30 판정 지표).
        # http.server.requests는 시계열이 많이 늘어 대시보드를 만드는 #619에서 정한다.
        transfer.duration: true

springdoc:
  # multipart 요청의 글 항목(@RequestParam)을 query 가 아니라 본문 form-data 로 문서화한다.
  # 소명 같은 개인정보가 생성 클라이언트에서 주소(접근 기록)로 나가지 않게 한다
  default-support-form-data: true
  swagger-ui:
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN

app:
  # 지급정지 이의제기 해제 게이트 설정값(D-36, Plan D10). 모두 내부 기준이고 화면과 Agent는 바꿀 수 없다.
  payment-stop:
    # 이의제기 첨부 파일(contract §5). 루트는 .gitignore 의 /data/ 아래다. 신분증 사본 암호화 키는 32바이트 base64 를
    # 환경변수로만 넣는다. 비어 있으면 신분증 사본을 받지 못한다
    documents:
      root: ${PAYMENT_STOP_DOCUMENT_ROOT:./data/objection-documents}
      encryption-key: ${PAYMENT_STOP_DOCUMENT_KEY:}
    # Agent 워커 연동(Plan D15). 키는 저장소에 두지 않고 환경변수로만 넣는다. 키가 비면 내부 API 를 모두 거부한다
    agent:
      enabled: ${PAYMENT_STOP_AGENT_ENABLED:false}
      worker-key: ${PAYMENT_STOP_WORKER_KEY:}
      token-ttl: 10m
      lease: 5m
      # DB 제약 ck_agent_run_attempt(attempt BETWEEN 0 AND 3, V202611051600)와 묶여 있다. 3보다 크게 올리면 가져가기의
      # attempt + 1 이 CHECK 를 어겨 claim 이 500 으로 끝나므로, 올릴 때는 새 증분 마이그레이션으로 CHECK 도 함께 바꾼다
      max-attempts: 3
    gate:
      fraud-window-hours: 24
      fraud-min-senders: 3
      fraud-min-deposit: 10000
      fraud-outflow-percent: 80
      fraud-outflow-minutes: 60
      relation-lookback-days: 180
      relation-min-count: 3
      relation-min-span-days: 30
      relation-min-lead-days: 30
      relation-max-amount-multiple: 5
      partial-small-amount: 3000000
      partial-livelihood-days: 90
      partial-livelihood-months: 2
  security:
    admin:
      # 관리자 세션 무조작 만료. 고객은 server.servlet.session.timeout(10m)을 그대로 쓴다 (admin_auth.md ④).
      session-timeout: 30m
  account:
    password:
      auth-token-ttl: 5m
  otp:
    code-ttl: 3m
    auth-token-ttl: 5m
    # Phase 1 최종 범위는 실제 발송 없는 Mock OTP이므로 모든 환경에서 번호를 응답한다.
    expose-code: true
  signup:
    token:
      terms-auth-ttl: 30m
      user-id-check-ttl: 3m
      email-verification-ttl: 30m
      account-auth-ttl: 10m
      temp-signup-ttl: 30m
    email-verification:
      code-ttl: 3m
  # 지연이체 (PH-06, #772). enabled는 새로 보류할지만 정한다. S4 PH-30 측정 동안 끈다(transfer_seam.md §9-5)
  delayed-transfer:
    enabled: ${APP_DELAYED_TRANSFER_ENABLED:false}
    # 이만큼 EXECUTING에 머문 보류는 멈춘 것으로 보고 다시 실행한다. 이체 한 건보다 넉넉히 길게 둔다
    stuck-after: 5m
    batch-size: 100
    # 해제 시각이 지난 보류를 꺼내는 주기
    release:
      fixed-delay: 60s
  # 타행 전문 송신 (PH-33-②). 주소는 배포 단계마다 다르다(mock_external_server.md §5) — APP_INTERBANK_HOST·APP_INTERBANK_PORT
  interbank:
    host: 127.0.0.1
    port: 9300
    connect-timeout: 1s
    # 처리 불명(TIMEOUT) 기준. 넘으면 실패로 확정하지 않고 조회거래로 결과를 확인한다
    response-timeout: 3s
    # 상대 은행 장애 때 타행만 빠르게 거부해 당행 이체 스레드를 지킨다
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 20
      minimum-number-of-calls: 10
      wait-duration-in-open-state: 30s
    # 처리 불명 건 조회거래. 응답 대기보다 충분히 지난 건만 묻는다 — 아직 응답을 기다리는 건에 3001을 받지 않게 한다
    inquiry:
      min-age: 30s
      fixed-delay: 60s
      # 스케줄러 스레드가 2개라(#604) 한 번에 묻는 건수를 묶어 다른 스케줄을 오래 막지 않는다
      # 한 건 최대 4초(연결 1초 + 응답 3초) × 15건 = 1분
      batch-size: 15
  # 온프레미스 정보계 API (PH-77 ③). base-url 이 비어 있으면 호출하지 않고 적재 이력 없음 응답을 유지한다 — APP_INFO_API_BASE_URL·APP_INFO_API_SECRET
  info-api:
    base-url: ${APP_INFO_API_BASE_URL:}
    secret: ${APP_INFO_API_SECRET:}
    connect-timeout: 1s
    read-timeout: 5s
  # 거래번호 채번 행 하나를 잠글 때 예약할 번호 수(#786). 클수록 잠금이 줄고, 재시작 때 버려지는 번호가 는다
  transaction-sequence:
    block-size: 100
  subscription:
    early-termination:
      # #844 연결 이체 정리 및 동시성 통합 테스트 완료 전까지 반드시 false
      enabled: false
      # PH-16 P3 승인: 가입 확정 금리 × 경과기간별 적용률
      # 가입일 포함·해지일 제외, 이율 중간 절사 없음
      rate-tiers:
        - min-days: 0
          multiplier: 0.10
        - min-days: 30
          multiplier: 0.20
        - min-days: 90
          multiplier: 0.40
        - min-days: 180
          multiplier: 0.60
        - min-days: 365
          multiplier: 0.80
  interest:
    income-tax-rate: "0.14"
    local-tax-ratio: "0.10"
  # 즉시 재시도까지 실패한 알림 발행 기록을 다시 보내는 주기(#709)
  notification:
    resubmission:
      fixed-delay: 5m
