server:
  servlet:
    context-path: /api/v1
    session:
      timeout: 10m
      cookie:
        http-only: true
        same-site: lax
spring:
  application:
    name: corebank
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
          batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
  data:
    redis:
      port: 6379

springdoc:
  swagger-ui:
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN

app:
  security:
    admin:
      # #448 임시 가드 — /admin/** 접근을 허용할 customer_id 목록(쉼표 구분). 비어 있으면 전부 403.
      # 로컬에서 쓰려면 ADMIN_BOOTSTRAP_CUSTOMER_IDS=<customer_id> ./gradlew bootRun.
      # 시드 계정(공개 저장소에 비밀번호가 있는 공개 픽스처)의 customer_id는 넣지 않는다.
      # PH-49a 역할 기반 인가로 교체될 때 함께 지운다.
      bootstrap-customer-ids: ${ADMIN_BOOTSTRAP_CUSTOMER_IDS:}
  account:
    password:
      auth-token-ttl: 5m
  otp:
    code-ttl: 3m
    auth-token-ttl: 5m
    # Phase 1 최종 범위는 실제 발송 없는 Mock OTP이므로 모든 환경에서 번호를 응답한다.
    expose-code: true
  signup:
    token:
      terms-auth-ttl: 30m
      user-id-check-ttl: 3m
      email-verification-ttl: 30m
      account-auth-ttl: 10m
      temp-signup-ttl: 30m
    email-verification:
      code-ttl: 3m
