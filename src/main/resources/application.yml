server:
  servlet:
    context-path: /api/v1
    session:
      timeout: 10m
      cookie:
        http-only: true
        same-site: lax
spring:
  application:
    name: corebank
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
          batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
  data:
    redis:
      port: 6379

app:
  otp:
    code-ttl: 3m
    auth-token-ttl: 5m
  signup:
    token:
      terms-auth-ttl: 30m
      user-id-check-ttl: 3m
      email-verification-ttl: 30m
      account-auth-ttl: 10m
      temp-signup-ttl: 30m
    email-verification:
      code-ttl: 3m
