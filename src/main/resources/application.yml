server:
  servlet:
    context-path: /api/v1
    session:
      timeout: 10m
      cookie:
        http-only: true
        same-site: lax
spring:
  application:
    name: corebank
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
          batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
  task:
    scheduling:
      pool:
        # COB(23:30)가 대사로 길어져도 00:10 자동이체 등 다른 @Scheduled가 같은 스레드를 기다리지 않게 한다 (#604)
        size: 2
  data:
    redis:
      port: 6379

management:
  health:
    redis:
      # provider=jdbc면 Redis가 내려가도 UP이어야 한다. redis일 때만 RedisEphemeralStoreHealthConfiguration이 넣는다.
      enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        # 구간별 건수(_bucket)를 내야 Prometheus에서 histogram_quantile로 이체 p95를 낼 수 있다(PH-30 판정 지표).
        # http.server.requests는 시계열이 많이 늘어 대시보드를 만드는 #619에서 정한다.
        transfer.duration: true

springdoc:
  swagger-ui:
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN

app:
  # 일회성 토큰·OTP 발급 잠금·약관 열람 이력 저장소 (#580). jdbc(MySQL) | redis
  # PH-101-② 측정 A'/B' 전환과 장애 시 복귀용. 환경 변수는 APP_EPHEMERALSTORE_PROVIDER.
  # 바꾸면 이전 저장소에 발급된 토큰(최대 30분)은 쓸 수 없어 진행 중이던 사용자는 인증을 다시 받는다.
  ephemeral-store:
    provider: jdbc
  security:
    admin:
      # #448 임시 가드 — /admin/** 접근을 허용할 customer_id 목록(쉼표 구분). 비어 있으면 전부 403.
      # 로컬에서 쓰려면 ADMIN_BOOTSTRAP_CUSTOMER_IDS=<customer_id> ./gradlew bootRun.
      # 시드 계정(공개 저장소에 비밀번호가 있는 공개 픽스처)의 customer_id는 넣지 않는다.
      # PH-49a 역할 기반 인가로 교체될 때 함께 지운다.
      bootstrap-customer-ids: ${ADMIN_BOOTSTRAP_CUSTOMER_IDS:}
  account:
    password:
      auth-token-ttl: 5m
  otp:
    code-ttl: 3m
    auth-token-ttl: 5m
    # Phase 1 최종 범위는 실제 발송 없는 Mock OTP이므로 모든 환경에서 번호를 응답한다.
    expose-code: true
  signup:
    token:
      terms-auth-ttl: 30m
      user-id-check-ttl: 3m
      email-verification-ttl: 30m
      account-auth-ttl: 10m
      temp-signup-ttl: 30m
    email-verification:
      code-ttl: 3m
  # 타행 전문 송신 (PH-33-②). 주소는 배포 단계마다 다르다(mock_external_server.md §5) — APP_INTERBANK_HOST·APP_INTERBANK_PORT
  interbank:
    host: 127.0.0.1
    port: 9300
    connect-timeout: 1s
    # 처리 불명(TIMEOUT) 기준. 넘으면 실패로 확정하지 않고 조회거래로 결과를 확인한다
    response-timeout: 3s
    # 상대 은행 장애 때 타행만 빠르게 거부해 당행 이체 스레드를 지킨다
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 20
      minimum-number-of-calls: 10
      wait-duration-in-open-state: 30s
    # 처리 불명 건 조회거래. 응답 대기보다 충분히 지난 건만 묻는다 — 아직 응답을 기다리는 건에 3001을 받지 않게 한다
    inquiry:
      min-age: 30s
      fixed-delay: 60s
      # 스케줄러 스레드가 2개라(#604) 한 번에 묻는 건수를 묶어 다른 스케줄을 오래 막지 않는다
      batch-size: 20
  interest:
    income-tax-rate: "0.14"
    local-tax-ratio: "0.10"
