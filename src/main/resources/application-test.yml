spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: false
  datasource:
    hikari:
      # TransferExecutionServiceConcurrencyTest가 16개 스레드를 동시에 띄운다. 기본값(10)보다
      # 작으면 일부 스레드가 커넥션을 기다리다 Future#get(30s) 타임아웃이 나는데, 이게 실제
      # 데드락 회귀인지 커넥션 풀 대기인지 구분할 수 없어 워커 수와 맞춰 명시한다.
      maximum-pool-size: 16

app:
  # 컨텍스트를 같이 쓰는 테스트끼리 메모리 묶음이 이어지지 않게 한 개씩 받는다. 묶음 동작은 SequenceGeneratorBlockTest가 본다
  transaction-sequence:
    block-size: 1
  delayed-transfer:
    release:
      # 스위트가 도는 동안 해제 스케줄러가 다른 테스트의 보류를 실행하지 않게 한다. 테스트는 배치 서비스를 직접 부른다
      fixed-delay: 24h
  # 이의제기 Agent 내부 API 테스트용 워커 키. 운영 키는 환경변수로만 넣는다
  payment-stop:
    agent:
      enabled: true
      worker-key: test-worker-key-not-for-production

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
