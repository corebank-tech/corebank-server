spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/minicore?sslMode=REQUIRED&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      max-lifetime: 570000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    user: ${FLYWAY_USER}
    password: ${FLYWAY_PASSWORD}
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
