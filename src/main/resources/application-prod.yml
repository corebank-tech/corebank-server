server:
  # ALB가 TLS를 종료하고 HTTP로 전달하므로, X-Forwarded-* 헤더로 원래 scheme(https)을 인식하게 한다.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/minicore?sslMode=REQUIRED&connectionTimeZone=Asia/Seoul&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # 서버 연결 수 × 서버 대수 + 그 밖의 접속(약 15) ≤ DB 최대 연결(60). 서버가 2대가 되면 다시 계산한다(#553).
      maximum-pool-size: 20
      connection-timeout: 3000
      max-lifetime: 570000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    user: ${FLYWAY_USER}
    password: ${FLYWAY_PASSWORD}
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  security:
    cors:
      #프론트엔드 운영 도메인 입력 ex)CORS_ALLOWED_ORIGINS=https://www.example.com
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    csrf:
      # www.corebank.cloud가 api.corebank.cloud의 CSRF 토큰을 읽도록 상위 도메인을 공유한다.
      cookie-domain: corebank.cloud
