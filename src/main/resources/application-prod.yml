server:
  # ALB가 TLS를 종료하고 HTTP로 전달하므로, X-Forwarded-* 헤더로 원래 scheme(https)과 접속 IP를 인식하게 한다.
  # 톰캣 RemoteIpValve가 X-Forwarded-For를 끝에서부터 읽어, 사설 IP(ALB, VPC 10.30.0.0/16)는 건너뛰고
  # 처음 나오는 IP를 접속 IP로 쓴다. 고객이 앞에 써넣은 값은 무시된다(#458).
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/minicore?sslMode=REQUIRED&connectionTimeZone=Asia/Seoul&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # 측정 때 컨테이너 환경변수로만 바꾼다. 서버 2대면 RDS 연결 60 때문에 18이 상한이다(#798).
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
      max-lifetime: 570000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    user: ${FLYWAY_USER}
    password: ${FLYWAY_PASSWORD}
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  security:
    cors:
      #프론트엔드 운영 도메인 입력 ex)CORS_ALLOWED_ORIGINS=https://www.example.com
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    csrf:
      # www.corebank.cloud가 api.corebank.cloud의 CSRF 토큰을 읽도록 상위 도메인을 공유한다.
      cookie-domain: corebank.cloud
  audit:
    archive:
      # 감사 로그 WORM 적재 버킷(PH-72 terraform/audit). WAS 역할에 corebank-audit-writer 정책이 붙어야 적재된다(PH-82).
      storage: s3
      bucket: corebank-audit-worm-853900964665
