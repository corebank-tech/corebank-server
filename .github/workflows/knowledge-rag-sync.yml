name: Knowledge RAG Sync

# 색인은 기본 브랜치(dev) 하나만 담는다. main 문서는 릴리스 때 dev를 병합한 과거본이라(협업 가이드)
# 같이 색인하면 늦게 돈 main 실행이 dev의 새 내용을 옛 내용으로 덮는다.
on:
  push:
    branches: [dev]
    paths:
      - 'docs/**.md'

concurrency:
  # push는 동기화 신호일 뿐이다. 각 실행은 push된 커밋이 아니라 실행 시점의 dev 끝을 받아
  # 마지막 반영 커밋부터 그 끝까지 맞추므로, 대기 실행이 취소되거나 Re-run이 늦게 돌아도 결과는 항상 현재 dev다.
  # 실행 중인 것은 취소하지 않는다(EC2에서 색인 중인 명령을 끊지 않으려고).
  group: knowledge-rag-sync
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: 'ap-northeast-2'

jobs:
  sync:
    name: Sync docs/**.md changes to knowledge-rag index
    runs-on: ubuntu-latest
    # EC2 쪽 sync.sh는 PR, Fineract cron 색인과 잠금을 공유해 최대 25분 기다리고, 색인은 문서당 약 1분이다.
    # 쌓인 변경을 한 번에 따라잡을 때도 끝나도록 SSM 실행 한도 70분, 폴링 65분, job 75분으로 둔다.
    timeout-minutes: 75
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          # push된 커밋이 아니라 지금의 dev 끝을 받는다
          ref: dev
          fetch-depth: 0
          # 이후 단계는 인증된 git 명령을 쓰지 않는다. 토큰을 .git/config에 남기지 않는다
          persist-credentials: false

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_KNOWLEDGE_RAG_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Compute changed/deleted docs
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          LAST_SYNCED_PARAM: /corebank-knowledge-rag/last-synced/dev
        run: |
          AFTER=$(git rev-parse HEAD)

          # 새 브랜치 최초 push는 before가 전부 0 — 부모 커밋 존재를 가정하지 않고
          # git의 빈 트리 오브젝트를 기준점으로 쓴다.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          fi

          # 색인은 마지막 반영 커밋의 트리와 같다. 그 트리와 지금 dev 트리의 차이만 반영하면 색인이 현재 dev가 된다.
          # 트리 비교라 조상 관계는 따지지 않는다. 기록이 없거나 그 커밋이 이 clone에 없으면(force push로 사라짐)
          # 이번 push 범위로 대신한다.
          BASE="$BEFORE"
          if LAST=$(aws ssm get-parameter --name "$LAST_SYNCED_PARAM" --query Parameter.Value --output text 2>/tmp/last-err); then
            if git cat-file -e "$LAST^{commit}" 2>/dev/null; then
              BASE="$LAST"
            else
              echo "::warning::마지막 반영 커밋 $LAST 이 저장소에 없어 이번 push 범위만 동기화한다"
            fi
          elif grep -q ParameterNotFound /tmp/last-err; then
            echo "::warning::마지막 반영 커밋 기록이 없어 이번 push 범위만 동기화한다"
          else
            cat /tmp/last-err
            exit 1
          fi
          echo "diff 범위: $BASE..$AFTER"

          # --name-only만 쓰면 rename이 새 경로로만 잡히고 옛 경로가 안 지워진 채 남는다.
          # --name-status -M으로 rename을 "R100<TAB>old<TAB>new" 형태로 받아
          # 옛 경로는 DELETED, 새 경로는 CHANGED로 나눈다.
          # 프로세스 치환 안의 git diff 실패는 셸이 못 잡아 빈 목록으로 조용히 넘어간다. 먼저 변수에 받는다
          DIFF=$(git diff --name-status -M --diff-filter=ACMRD "$BASE" "$AFTER" -- 'docs/**.md')

          CHANGED=""
          DELETED=""
          while IFS=$'\t' read -r status path1 path2; do
            [ -z "$status" ] && continue
            # 경로 목록을 따옴표 없이 공백으로 나눠 넘기므로(이후 단계와 EC2 sync.sh) 공백은 경로를 쪼개고
            # *, ?, [ 는 다른 파일명으로 확장된다. 지금 docs에는 없으니 조용히 잘못 동기화하지 않도록
            # 여기서 멈춘다. 생기면 구분자를 NUL로 바꾼다.
            if [[ "$path1$path2" =~ [[:space:]*?[] ]]; then
              echo "::error::공백이나 와일드카드 문자가 든 문서 경로는 동기화하지 않는다: $path1 $path2"
              exit 1
            fi
            case "$status" in
              A*|M*|C*) CHANGED="$CHANGED $path1" ;;
              D*) DELETED="$DELETED $path1" ;;
              R*) DELETED="$DELETED $path1"; CHANGED="$CHANGED $path2" ;;
            esac
          done <<< "$DIFF"

          CHANGED=$(echo "$CHANGED" | xargs)
          DELETED=$(echo "$DELETED" | xargs)

          # 파일명이 이후 단계의 셸 명령 문자열(특히 SSM commands 파라미터)에 그대로 섞여
          # 들어가면 크래프팅된 파일명으로 커맨드 인젝션이 가능하다 — base64로 감싸서
          # 셸 메타문자가 안전한 문자셋([A-Za-z0-9+/=])으로만 전달되게 한다.
          CHANGED_B64=$(printf '%s' "$CHANGED" | base64 | tr -d '\n')
          DELETED_B64=$(printf '%s' "$DELETED" | base64 | tr -d '\n')

          # 아래 단계의 조건이 deleted를 본다. 이 출력이 없으면 삭제만 있는 push에서 동기화가 돌지 않는다
          {
            echo "after=$AFTER"
            echo "changed=$CHANGED"
            echo "deleted=$DELETED"
            echo "changed_b64=$CHANGED_B64"
            echo "deleted_b64=$DELETED_B64"
          } >> "$GITHUB_OUTPUT"

      - name: Upload changed docs to sync bucket
        if: steps.diff.outputs.changed != ''
        env:
          # 파일명을 ${{ }}로 직접 run 스크립트 소스에 심으면 GitHub Actions 템플릿 치환
          # 단계에서 그대로 셸 구문이 되어 인젝션이 가능하다 — env로 넘겨 값(데이터)으로만
          # 다루게 한다.
          CHANGED_FILES: ${{ steps.diff.outputs.changed }}
          SYNC_BUCKET: ${{ secrets.KNOWLEDGE_RAG_SYNC_BUCKET }}
          SHA: ${{ steps.diff.outputs.after }}
        run: |
          for path in $CHANGED_FILES; do
            # 링크는 docs 밖 파일을 가리킬 수 있다. 일반 파일만 올린다
            if [ -L "$path" ] || [ ! -f "$path" ]; then
              echo "::error::일반 파일이 아닌 문서 경로는 올리지 않는다: $path"
              exit 1
            fi
            aws s3 cp "$path" "s3://${SYNC_BUCKET}/${SHA}/${path}"
          done

      - name: Trigger sync via SSM
        if: steps.diff.outputs.changed != '' || steps.diff.outputs.deleted != ''
        env:
          SYNC_BUCKET: ${{ secrets.KNOWLEDGE_RAG_SYNC_BUCKET }}
          INSTANCE_ID: ${{ secrets.KNOWLEDGE_RAG_EC2_INSTANCE_ID }}
          SHA: ${{ steps.diff.outputs.after }}
          CHANGED_B64: ${{ steps.diff.outputs.changed_b64 }}
          DELETED_B64: ${{ steps.diff.outputs.deleted_b64 }}
        run: |
          # CLI 단축 문법(commands="...")은 값 안의 작은따옴표를 파싱하지 못해 JSON으로 넘긴다.
          # 기본 실행 한도(3600초)는 잠금 대기와 큰 색인을 합치면 모자라 늘린다.
          PARAMS=$(jq -n \
            --arg cmd "/home/ubuntu/knowledge-mcp/scripts/sync.sh '$SYNC_BUCKET' '$SHA' '$CHANGED_B64' '$DELETED_B64'" \
            '{commands: [$cmd], executionTimeout: ["4200"]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --comment "Knowledge RAG sync ($SHA)" \
            --query 'Command.CommandId' \
            --output text)

          # aws ssm wait의 기본 대기 한도(약 100초)로는 큰 문서 색인(청크당 약 1초)과 잠금 대기를 못 기다린다.
          # 10초 간격으로 최대 65분 폴링한다.
          # 조회 직후의 InvocationDoesNotExist만 잠깐 기다리고, 조회 오류가 1분 넘게 이어지면 실패로 끝낸다.
          STATUS=Pending
          ERRORS=0
          for _ in $(seq 1 390); do
            sleep 10
            if ! STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/tmp/ssm-err); then
              ERRORS=$((ERRORS + 1))
              if [ "$ERRORS" -ge 6 ]; then
                cat /tmp/ssm-err
                echo "::error::SSM 명령 상태 조회가 계속 실패한다"
                exit 1
              fi
              continue
            fi
            ERRORS=0
            case "$STATUS" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}'

          # EC2에서 색인이 실패해도 job이 성공으로 끝나지 않게 한다(sync.sh는 실패 파일이 있으면 비0 종료)
          if [ "$STATUS" != "Success" ]; then
            echo "::error::knowledge-rag 동기화 실패: $STATUS"
            exit 1
          fi

      - name: Record last synced commit
        # 앞 단계가 모두 성공했을 때만 기록한다. 실패하면 다음 실행이 같은 범위를 다시 가져간다.
        env:
          AFTER: ${{ steps.diff.outputs.after }}
          LAST_SYNCED_PARAM: /corebank-knowledge-rag/last-synced/dev
        run: |
          aws ssm put-parameter --name "$LAST_SYNCED_PARAM" --type String --value "$AFTER" --overwrite > /dev/null
          echo "마지막 반영 커밋: $AFTER"
