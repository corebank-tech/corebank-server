name: Knowledge RAG Sync

on:
  push:
    branches: [main, dev]
    paths:
      - 'docs/**.md'

env:
  AWS_DEFAULT_REGION: 'ap-northeast-2'

jobs:
  sync:
    name: Sync docs/**.md changes to knowledge-rag index
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compute changed/deleted docs
        id: diff
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-parse "$AFTER^" 2>/dev/null || echo "$AFTER")
          fi

          CHANGED=$(git diff --diff-filter=ACMR --name-only "$BEFORE" "$AFTER" -- 'docs/**.md' | tr '\n' ' ')
          DELETED=$(git diff --diff-filter=D --name-only "$BEFORE" "$AFTER" -- 'docs/**.md' | tr '\n' ' ')

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "deleted=$DELETED" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials via OIDC
        if: steps.diff.outputs.changed != '' || steps.diff.outputs.deleted != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_KNOWLEDGE_RAG_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Upload changed docs to sync bucket
        if: steps.diff.outputs.changed != ''
        run: |
          for path in ${{ steps.diff.outputs.changed }}; do
            aws s3 cp "$path" "s3://${{ secrets.KNOWLEDGE_RAG_SYNC_BUCKET }}/${{ github.sha }}/$path"
          done

      - name: Trigger sync via SSM
        if: steps.diff.outputs.changed != '' || steps.diff.outputs.deleted != ''
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.KNOWLEDGE_RAG_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="/home/ubuntu/knowledge-mcp/scripts/sync.sh '${{ secrets.KNOWLEDGE_RAG_SYNC_BUCKET }}' '${{ github.sha }}' '${{ steps.diff.outputs.changed }}' '${{ steps.diff.outputs.deleted }}'" \
            --comment "Knowledge RAG sync (${{ github.sha }})" \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.KNOWLEDGE_RAG_EC2_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.KNOWLEDGE_RAG_EC2_INSTANCE_ID }}" \
            --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}'
