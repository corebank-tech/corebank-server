name: Corebank CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'corretto'
  DOCKER_IMAGE_NAME: 'corebank-server'
  MOCK_EXTERNAL_IMAGE_NAME: 'corebank-mock-external'

jobs:
  # -------------------------------------------------------------------------
  # 1. CI (빌드 및 테스트, 아티팩트 생성)
  # -------------------------------------------------------------------------
  build-and-test:
    name: Build & Test (CI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 소스코드 체크아웃 (v4 업그레이드). 마이그레이션 번호 검사가 base 커밋과 비교하려고 전체 기록을 받는다 (#814)
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PR이 추가한 V__ 마이그레이션이 base 최신보다 앞이면 실패 (#814). 빌드 전에 몇 초 안에 끝난다
      - name: Check migration version order
        if: github.event_name == 'pull_request'
        run: bash scripts/check-migration-order.sh "${{ github.event.pull_request.base.sha }}"

      # JDK 21 설정 및 Gradle 캐시 활성화 (빌드 속도 향상)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      # Gradle 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 코드 포맷 검사 (컴파일·테스트보다 먼저 실패시켜 피드백을 앞당김)
      - name: Check code format
        run: ./gradlew spotlessCheck

      # Gradle 빌드 및 테스트 수행
      - name: Build and test with Gradle
        run: ./gradlew build

      # build에 포함되지 않는 모의 대외기관 실행 jar (타행이체 B 단계 컨테이너용, #697)
      - name: Build mock external jar
        run: ./gradlew mockExternalJar

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/jacocoTestReport.xml
          retention-days: 1

      # 빌드 산출물(JAR)을 아티팩트로 업로드 (중복 빌드 방지)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: corebank-jar
          path: build/libs/*SNAPSHOT.jar
          retention-days: 1

      - name: Upload mock external artifact
        uses: actions/upload-artifact@v4
        with:
          name: mock-external-jar
          path: build/mock-external/mock-external.jar
          retention-days: 1

  # -------------------------------------------------------------------------
  # 1-B. 커버리지를 PR 코멘트로 표시
  # -------------------------------------------------------------------------
  coverage-comment:
    name: Coverage Comment (CI)
    needs: build-and-test
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: jacoco
      - name: Report coverage on PR
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: ${{ github.workspace }}/jacoco/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          title: '커버리지 (JaCoCo INSTRUCTION 기준)'
          update-comment: true
          comment-type: both

  # -------------------------------------------------------------------------
  # 2. 이미지 빌드·푸시 (Docker Hub). 서버에는 배포하지 않는다(#963)
  # -------------------------------------------------------------------------
  deploy:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      # 소스코드 체크아웃 (Dockerfile 등 구성 파일 가져오기)
      - name: Checkout source code
        uses: actions/checkout@v4

      # CI 잡에서 빌드된 JAR 산출물 다운로드 (중복 빌드 제거)
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: corebank-jar
          path: build/libs/

      - name: Download mock external artifact
        uses: actions/download-artifact@v4
        with:
          name: mock-external-jar
          path: build/mock-external/

      # Docker Buildx 설정 (멀티 플랫폼 및 GHA 캐시 사용 지원)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # DockerHub 로그인
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Docker 이미지 빌드 및 푸시 (Build-Push Action 및 GHA 빌드 캐시 활용)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 타행이체 모의 대외기관 이미지 (B 단계, #697). 컷오버 뒤에는 같은 이미지를 온프레미스 VM에서 띄운다.
      - name: Build and push mock external image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mock-external
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.MOCK_EXTERNAL_IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.MOCK_EXTERNAL_IMAGE_NAME }}:${{ github.sha }}
