name: Corebank CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'corretto'
  DOCKER_IMAGE_NAME: 'corebank-server'
  CONTAINER_NAME: 'corebank-server'
  SERVER_PORT: '8080'
  AWS_DEFAULT_REGION: 'ap-northeast-2'

jobs:
  # -------------------------------------------------------------------------
  # 1. CI (빌드 및 테스트, 아티팩트 생성)
  # -------------------------------------------------------------------------
  build-and-test:
    name: Build & Test (CI)
    runs-on: ubuntu-latest
    steps:
      # 소스코드 체크아웃 (v4 업그레이드)
      - name: Checkout source code
        uses: actions/checkout@v4

      # JDK 21 설정 및 Gradle 캐시 활성화 (빌드 속도 향상)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      # Gradle 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Gradle 빌드 및 테스트 수행
      - name: Build and test with Gradle
        run: ./gradlew build

      # 빌드 산출물(JAR)을 아티팩트로 업로드 (중복 빌드 방지)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: corebank-jar
          path: build/libs/*SNAPSHOT.jar
          retention-days: 1

  # -------------------------------------------------------------------------
  # 2. CD (Docker 이미지 빌드 & EC2 SSH 배포)
  # -------------------------------------------------------------------------
  deploy:
    name: Build Docker Image & Deploy (CD)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # AWS OIDC 토큰 발급 및 레포지토리 읽기를 위한 필수 권한
    permissions:
      id-token: write
      contents: read
    steps:
      # 소스코드 체크아웃 (Dockerfile 등 구성 파일 가져오기)
      - name: Checkout source code
        uses: actions/checkout@v4

      # CI 잡에서 빌드된 JAR 산출물 다운로드 (중복 빌드 제거)
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: corebank-jar
          path: build/libs/

      # Docker Buildx 설정 (멀티 플랫폼 및 GHA 캐시 사용 지원)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # DockerHub 로그인
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Docker 이미지 빌드 및 푸시 (Build-Push Action 및 GHA 빌드 캐시 활용)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 0) repo 디버깅 스텝
      - name: Debug OIDC subject
        run: |
          echo "expected sub = repo:${{ github.repository }}:ref:${{ github.ref }}"

      # 1) AWS OIDC 자격 증명 획득
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      # 2) EC2 내부에서 인라인 Docker Compose 배포
      - name: Deploy to EC2 via AWS SSM Run Command
        run: |
          # 1. EC2 내부에서 실행될 인라인 스크립트 작성
          COMMANDS=$(cat << 'EOF'
          mkdir -p /home/ubuntu/corebank
          cd /home/ubuntu/corebank
          
          # EC2 내부에서 인라인으로 docker-compose.yml 생성
          cat << 'COMPOSE_EOF' > docker-compose.yml
          services:
            corebank-server:
              image: DOCKER_USERNAME_PLACEHOLDER/DOCKER_IMAGE_PLACEHOLDER:TAG_PLACEHOLDER
              container_name: CONTAINER_NAME_PLACEHOLDER
              restart: unless-stopped
              ports:
                - "80:SERVER_PORT_PLACEHOLDER"
              environment:
                - SPRING_PROFILES_ACTIVE=prod
                - TZ=Asia/Seoul
              networks:
                - corebank-net

          networks:
            corebank-net:
              driver: bridge
          COMPOSE_EOF

          # 환경 변수 및 태그 실제 값으로 치환
          sed -i "s|DOCKER_USERNAME_PLACEHOLDER|${{ secrets.DOCKER_USERNAME }}|g" docker-compose.yml
          sed -i "s|DOCKER_IMAGE_PLACEHOLDER|${{ env.DOCKER_IMAGE_NAME }}|g" docker-compose.yml
          sed -i "s|TAG_PLACEHOLDER|${{ github.sha }}|g" docker-compose.yml
          sed -i "s|CONTAINER_NAME_PLACEHOLDER|${{ env.CONTAINER_NAME }}|g" docker-compose.yml
          sed -i "s|SERVER_PORT_PLACEHOLDER|${{ env.SERVER_PORT }}|g" docker-compose.yml
          
          # Docker Compose를 이용한 최신 이미지 풀 및 무중단/선언적 배포
          docker compose pull
          docker compose up -d --remove-orphans
          
          # 이전 오래된 도커 이미지 정리 (디스크 용량 확보)
          docker image prune -f || true
          EOF
          )

          # 2. jq를 사용하여 안전하게 JSON 파라미터 구성
          PARAMETERS=$(jq -n --arg cmd "$COMMANDS" '{"commands": [$cmd]}')

          # 3. AWS SSM Run Command 실행
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --comment "Deploy Corebank Server via SSM (${{ github.sha }})"
