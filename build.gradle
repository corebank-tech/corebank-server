plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '7.0.2'
    id 'jacoco'
    id 'net.ltgt.errorprone' version '4.4.0'
}

group = 'com.shinhan'
version = '0.0.1-SNAPSHOT'
description = 'corebank'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 모의 대외기관 서버 (PH-33-①). 운영 jar와 따로 빌드·실행하고, main에서는 JDK만 쓰는 전문 변환기만 가져다 쓴다.
sourceSets {
    mockExternal {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.mockExternal.output
        runtimeClasspath += sourceSets.mockExternal.output
    }
}

tasks.register('runMockExternal', JavaExec) {
    group = 'application'
    description = '모의 대외기관 서버를 띄운다 (PH-33-①). 인자 예: --args="--port=9300 --admin-port=9301"'
    classpath = sourceSets.mockExternal.runtimeClasspath
    mainClass = 'com.shinhan.mockexternal.MockExternalServer'
}

// VM에 그대로 올리는 실행 파일. Spring·DB 없이 JDK 21만으로 뜬다 — java -jar mock-external.jar
tasks.register('mockExternalJar', Jar) {
    group = 'build'
    description = '모의 대외기관 서버 실행 jar를 만든다 (PH-33-①)'
    archiveFileName = 'mock-external.jar'
    destinationDirectory = layout.buildDirectory.dir('mock-external')
    from sourceSets.mockExternal.output
    from(sourceSets.main.output) {
        include 'com/shinhan/corebank/transfer/adapter/out/external/**'
    }
    manifest {
        attributes 'Main-Class': 'com.shinhan.mockexternal.MockExternalServer'
    }
}

repositories {
    mavenCentral()
}

ext {
    queryDslVersion = '7.1'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // JPA + MySQL
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Redis (약관 열람 이력, TTL 기반)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Querydsl (OpenFeign 포크, io.github.openfeign.querydsl)
    implementation "io.github.openfeign.querydsl:querydsl-jpa:${queryDslVersion}"
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${queryDslVersion}:jpa"
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // Flyway (Boot 4: 스타터 필수)
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'

    // 검증
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Swagger / OpenAPI UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // JSON 구조화 로깅 (PH-42)
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.springframework.security:spring-security-test'

    // 아키텍처 규칙(헥사고날 레이어 방향) 자동 검증
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'

    //세션·인증 필터
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 박싱 동일성 검사 (#358)
    errorprone 'com.google.errorprone:error_prone_core:2.49.0'
}

// 박싱 동일성 검사 (#358)
// 금액 필드를 wrapper 로 통일하면 Long 끼리의 == 를 타입이 막지 못한다.
// Long.valueOf(long)은 -128~127 값을 항상 캐시하지만, 그 밖의 값은 참조 동일성을 보장하지 않는다.
// 기존 코드에 경고가 쏟아지면 결국 꺼버리게 되므로, 전체를 끄고 이것만 오류로 켠다.
tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        disableAllChecks = true
        check('BoxedPrimitiveEquality', net.ltgt.gradle.errorprone.CheckSeverity.ERROR)
        disableWarningsInGeneratedCode = true
        excludedPaths = '.*/build/generated/.*' // QueryDSL Q타입은 생성물이라 제외
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // #402: 공유 컨테이너의 수명은 테스트 JVM과 일치시키고 병렬 검증은 각 테스트 내부에서 수행한다.
    maxParallelForks = 1
    forkEvery = 0
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
    systemProperty 'spring.test.context.cache.maxSize', '4'
    finalizedBy tasks.named('jacocoTestReport')
}

def coveredClasses = files(sourceSets.main.output.classesDirs).asFileTree.matching {
    exclude '**/Q*.class'
    exclude '**/*JpaEntity.class'
    exclude '**/*JpaEntity$*.class'
    exclude '**/config/**'
}

// 커버리지 리포트(REQ-NFR-015).
tasks.named('jacocoTestReport') {
    reports {
        html.required = true
        xml.required = true
    }
    classDirectories.setFrom(coveredClasses)
}

// 커버리지 검증(REQ-NFR-015) - 원장 변경 도메인은 서비스 계층 커버리지 80% 이상을 유지.
tasks.named('jacocoTestCoverageVerification') {
    classDirectories.setFrom(coveredClasses)
    violationRules {
        rule {
            element = 'PACKAGE'
            includes = ['com.shinhan.corebank.*.application.service']
            limit {
                counter = 'LINE'
                minimum = 0.80
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

tasks.named('jar') {
    enabled = false
}

// 코드 포맷 자동화 (#352)
// 들여쓰기 4칸·최대 120자 — 기존 코드 스타일과 가장 가까워 변경 폭이 작다.
spotless {
    java {
        target 'src/**/*.java'
        targetExclude '**/build/**', '**/generated/**' // QueryDSL Q타입은 생성물이라 제외
        palantirJavaFormat('2.68.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        toggleOffOn() // 정렬을 유지할 구간은 spotless:off ~ spotless:on 으로 감싼다
    }
    // 마크다운은 후행 공백 2칸이 줄바꿈 문법이라 대상에서 뺀다.
    format 'misc', {
        target '*.gradle', '.gitignore'
        trimTrailingWhitespace()
        endWithNewline()
    }
}
