plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '7.0.2'
}

group = 'com.shinhan'
version = '0.0.1-SNAPSHOT'
description = 'corebank'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    queryDslVersion = '7.1'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // JPA + MySQL
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Redis (약관 열람 이력, TTL 기반)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Querydsl (OpenFeign 포크, io.github.openfeign.querydsl)
    implementation "io.github.openfeign.querydsl:querydsl-jpa:${queryDslVersion}"
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${queryDslVersion}:jpa"
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // Flyway (Boot 4: 스타터 필수)
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'

    // 검증
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Swagger / OpenAPI UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.springframework.security:spring-security-test'

    // 아키텍처 규칙(헥사고날 레이어 방향) 자동 검증
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'

    //세션·인증 필터
    implementation 'org.springframework.boot:spring-boot-starter-security'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    enabled = false
}

// 코드 포맷 자동화 (#352)
// 들여쓰기 4칸·최대 120자 — 기존 코드 스타일과 가장 가까워 변경 폭이 작다.
spotless {
    java {
        target 'src/**/*.java'
        targetExclude '**/build/**', '**/generated/**' // QueryDSL Q타입은 생성물이라 제외
        palantirJavaFormat('2.68.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        toggleOffOn() // 정렬을 유지할 구간은 spotless:off ~ spotless:on 으로 감싼다
    }
    // 마크다운은 후행 공백 2칸이 줄바꿈 문법이라 대상에서 뺀다.
    format 'misc', {
        target '*.gradle', '.gitignore'
        trimTrailingWhitespace()
        endWithNewline()
    }
}
